name: Deploy to CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test --run

      - name: Build
        run: pnpm build
        env:
          VITE_DB_PROVIDER: cloudbase
          VITE_CLOUDBASE_ENV: ${{ secrets.CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_REGION: ap-shanghai
          VITE_CLOUDBASE_ACCESS_KEY: ${{ secrets.CLOUDBASE_ACCESS_KEY }}

      - name: Install CloudBase CLI
        run: npm i -g @cloudbase/cli@latest

      - name: Login to CloudBase
        run: tcb login --apiKeyId ${{ secrets.CLOUDBASE_SECRET_ID }} --apiKey ${{ secrets.CLOUDBASE_SECRET_KEY }}

      - name: Deploy to CloudBase Hosting
        run: tcb hosting deploy dist -e ${{ secrets.CLOUDBASE_ENV_ID }}
