<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 女性共学小组 · 第一期</title>
<script>
  (function(){
    var t=localStorage.getItem('theme');
    if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'warm';
    document.documentElement.setAttribute('data-theme',t);
    try{var c=JSON.parse(localStorage.getItem('theme-tokens'));
    if(c){var s=document.documentElement.style;for(var k in c)s.setProperty('--'+k,c[k])}}catch(e){}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.jsx"></script>
</body>
</html>
